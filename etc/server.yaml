engine:
  type: "in_memory"
network:
  address: "127.0.0.1:8080"
  max_connections: 2
  max_message_size: "4KB"
  idle_timeout: 5m
logging:
  level: "info"
  # output: "./.log/output.log"
  output: "stdout"
wal:
  flushing_batch_length: 100
  flushing_batch_timeout: "10ms"
  max_segment_size: "1KB"
  data_directory: "./.wal"
